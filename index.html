<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Contas">
  <title>Contas da Casa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // aplica o tema escolhido antes de desenhar a página (evita piscar)
    try { const t = localStorage.getItem("tema"); if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><p class="carregando">Carregando…</p></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
